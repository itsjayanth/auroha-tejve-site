<!--
  Auroha Tejve — email signature template
  ----------------------------------------
  Table-based markup for maximum compatibility across Gmail, Outlook, and
  Apple Mail. Before use:

  1. Host `signature-icon-128.png` at a public URL (e.g.
     https://aurohatejve.com/brand/signature-icon-128.png) and replace the
     src below — email clients cannot load local file paths.
  2. Replace [Full Name], [Job Title], and [phone] with real values.
  3. Paste the rendered output into your email client's signature editor
     (compose a draft, paste, then save as signature — pasting preserves
     the inline styles better than pasting raw HTML in most clients).
-->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; color: #1a1a2e;">
  <tr>
    <td style="padding-right: 16px; vertical-align: top;">
      <img
        src="https://aurohatejve.com/brand/signature-icon-128.png"
        width="48"
        height="48"
        alt="Auroha Tejve"
        style="display: block; border-radius: 12px;"
      />
    </td>
    <td style="border-left: 2px solid #6E56F8; padding-left: 16px; vertical-align: top;">
      <div style="font-size: 15px; font-weight: 700; color: #1a1a2e;">[Full Name]</div>
      <div style="font-size: 13px; color: #6b6b7c; margin-top: 2px;">[Job Title] · Auroha Tejve Private Limited</div>
      <div style="font-size: 13px; margin-top: 8px;">
        <a href="mailto:hello@aurohatejve.com" style="color: #6E56F8; text-decoration: none;">hello@aurohatejve.com</a>
        &nbsp;·&nbsp;
        <a href="https://aurohatejve.com" style="color: #6E56F8; text-decoration: none;">aurohatejve.com</a>
        &nbsp;·&nbsp;<span style="color: #6b6b7c;">[phone]</span>
      </div>
    </td>
  </tr>
</table>
